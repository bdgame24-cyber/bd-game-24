<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HGNICE - Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    h2 { border-bottom: 2px solid #ff4d4f; padding-bottom: 10px; margin-bottom: 20px; color: #ff4d4f; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #ff4d4f; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin Management Dashboard</h2>
    <h3>User E-Wallet Payment Methods</h3>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Type</th>
          <th>Account Name</th>
          <th>Phone / Account Number</th>
        </tr>
      </thead>
      <tbody id="walletTable">
        <!-- Dynamic Data Loads Here -->
      </tbody>
    </table>
  </div>

  <script>
    async function fetchWallets() {
      const res = await fetch('/api/admin/wallets');
      const wallets = await res.json();
      const tableBody = document.getElementById('walletTable');
      tableBody.innerHTML = '';
      wallets.forEach(item => {
        tableBody.innerHTML += `
          <tr>
            <td>${item.userId}</td>
            <td>${item.type}</td>
            <td>${item.name}</td>
            <td>${item.account}</td>
          </tr>
        `;
      });
    }
    fetchWallets();
  </script>
</body>
</html>
