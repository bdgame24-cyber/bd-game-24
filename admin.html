<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD GAME 24 - Admin Panel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Admin Login Form -->
        <div class="card" id="loginCard">
            <h2 class="header-title" style="color: #ef4444;">Admin Login</h2>
            <br>
            <label>Username:</label>
            <input type="text" id="adminUser" placeholder="Enter Username">
            <br><br>
            <label>Password:</label>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <br><br>
            <button class="btn btn-red" style="width: 100%;" onclick="loginAdmin()">Login</button>
        </div>

        <!-- Admin Control Panel (Login Completed) -->
        <div id="adminPanel" style="display: none;">
            <div class="card" style="border-color: #ef4444;">
                <h1 class="header-title" style="color: #ef4444;">ADMIN CONTROL PANEL</h1>
                <p class="sub-title">BD GAME 24 Management Engine</p>
            </div>

            <div class="card">
                <h3>Payment Gateway Control</h3>
                <label>bKash Number:</label>
                <input type="text" id="adminBkash" value="01700000000">
                <button class="btn btn-blue" onclick="updateNumber('bkash', 'adminBkash')">Save bKash</button>

                <br><br>
                <label>Nagad Number:</label>
                <input type="text" id="adminNagad" value="01800000000">
                <button class="btn btn-blue" onclick="updateNumber('nagad', 'adminNagad')">Save Nagad</button>
            </div>

            <div class="card">
                <h3>Manual Result Control (Force Winner)</h3>
                <div class="btn-group">
                    <button class="btn btn-red" onclick="forceWinner('RED')">Force RED</button>
                    <button class="btn btn-green" onclick="forceWinner('GREEN')">Force GREEN</button>
                    <button class="btn btn-violet" onclick="forceWinner('VIOLET')">Force VIOLET</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loginAdmin() {
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(res => {
                if(res.error) {
                    alert(res.error);
                } else {
                    document.getElementById('loginCard').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                }
            });
        }

        function updateNumber(gateway, inputId) {
            const newNumber = document.getElementById(inputId).value;
            fetch('/api/admin/update-gateway', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ gateway, newNumber })
            }).then(r => r.json()).then(res => {
                alert(res.message || res.error);
            });
        }

        function forceWinner(color) {
            fetch('/api/admin/set-result', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ color })
            }).then(r => r.json()).then(res => {
                alert(res.message);
            });
        }
    </script>
</body>
    </html>
