<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD GAME 24 - Color Prediction</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="header-title">BD GAME 24</h1>
            <p class="sub-title">Live Color Betting Platform</p>
            <h3>User Balance: <span id="balanceDisplay" style="color:#10b981;">1000</span> BDT</h3>
        </div>

        <div class="card timer-box">
            <h4>Period ID: <span id="periodId">BD20260907001</span></h4>
            <div class="timer-text" id="timerDisplay">00:60</div>
            <p id="statusDisplay" style="color:#38bdf8;">Status: OPEN</p>
        </div>

        <div class="card">
            <h3>Place Your Bet</h3>
            <label>Amount (BDT):</label>
            <input type="number" id="betAmount" value="100" min="10">

            <div class="btn-group">
                <button class="btn btn-red" onclick="placeBet('RED')">Bet Red (2x)</button>
                <button class="btn btn-green" onclick="placeBet('GREEN')">Bet Green (2x)</button>
                <button class="btn btn-violet" onclick="placeBet('VIOLET')">Bet Violet (4.5x)</button>
            </div>
        </div>

        <div class="card">
            <h3>Deposit Money</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">
                bKash: <b id="bkashNum">Loading...</b> | Nagad: <b id="nagadNum">Loading...</b>
            </p>
            <select id="gatewaySelect">
                <option value="bkash">bKash</option>
                <option value="nagad">Nagad</option>
                <option value="rocket">Rocket</option>
            </select>
            <input type="text" id="trxId" placeholder="Enter Transaction ID (TrxID)">
            <input type="number" id="depAmount" placeholder="Enter Amount BDT">
            <button class="btn btn-blue" style="width:100%;" onclick="submitDeposit()">Submit Deposit</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUserId = 102; // Sample User ID

        // Load Gateways
        fetch('/api/payment-numbers').then(r => r.json()).then(data => {
            document.getElementById('bkashNum').innerText = data.bkash;
            document.getElementById('nagadNum').innerText = data.nagad;
        });

        socket.on('timer_tick', (data) => {
            document.getElementById('timerDisplay').innerText = `00:${data.timer < 10 ? '0' : ''}${data.timer}`;
            document.getElementById('periodId').innerText = data.periodId;
            document.getElementById('statusDisplay').innerText = `Status: ${data.status}`;
        });

        socket.on('round_result', (data) => {
            alert(`Round Ended! Winning Color: ${data.winningColor}`);
        });

        function placeBet(color) {
            const amount = document.getElementById('betAmount').value;
            fetch('/api/bet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUserId, color, amount: parseFloat(amount) })
            }).then(r => r.json()).then(res => {
                if(res.error) alert(res.error);
                else {
                    alert("বেট সফল হয়েছে!");
                    document.getElementById('balanceDisplay').innerText = res.balance;
                }
            });
        }

        function submitDeposit() {
            const gateway = document.getElementById('gatewaySelect').value;
            const trxId = document.getElementById('trxId').value;
            const amount = document.getElementById('depAmount').value;

            fetch('/api/deposit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUserId, gateway, trxId, amount })
            }).then(r => r.json()).then(res => {
                alert(res.message);
            });
        }
    </script>
</body>
</html>
