<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD GAME 24 - Win Go</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    
    <div class="card wallet-card">
      <div class="wallet-balance">
        <p>Wallet Balance</p>
        <h2>৳ <span id="balance">1000.00</span></h2>
      </div>
      <div class="wallet-btns">
        <button class="btn btn-withdraw">Withdraw</button>
        <button class="btn btn-deposit">Deposit</button>
      </div>
    </div>

    <div class="notice-bar">
      <span>📢 Attention! Customer service only uses LIVE CHAT...</span>
    </div>

    <div class="time-tabs">
      <div class="tab active">Win Go<br><small>1Min</small></div>
      <div class="tab">Win Go<br><small>3Min</small></div>
      <div class="tab">Win Go<br><small>5Min</small></div>
      <div class="tab">Win Go<br><small>10Min</small></div>
    </div>

    <div class="card timer-card">
      <div class="timer-info">
        <p class="game-title">Win Go 1Min</p>
        <p class="period-text">Period: <span id="periodId">20260907001</span></p>
      </div>
      <div class="timer-clock">
        <p>Time remaining</p>
        <div class="clock-display" id="timer">00:45</div>
      </div>
    </div>

    <div class="action-btns">
      <button class="btn-color btn-green" onclick="selectBet('GREEN')">Green</button>
      <button class="btn-color btn-violet" onclick="selectBet('VIOLET')">Violet</button>
      <button class="btn-color btn-red" onclick="selectBet('RED')">Red</button>
    </div>

    <div class="number-grid">
      <button class="num-btn red-violet" onclick="selectNum(0)">0</button>
      <button class="num-btn green" onclick="selectNum(1)">1</button>
      <button class="num-btn red" onclick="selectNum(2)">2</button>
      <button class="num-btn green" onclick="selectNum(3)">3</button>
      <button class="num-btn red" onclick="selectNum(4)">4</button>
      <button class="num-btn red-violet" onclick="selectNum(5)">5</button>
      <button class="num-btn red" onclick="selectNum(6)">6</button>
      <button class="num-btn green" onclick="selectNum(7)">7</button>
      <button class="num-btn red" onclick="selectNum(8)">8</button>
      <button class="num-btn green" onclick="selectNum(9)">9</button>
    </div>

    <div class="size-btns">
      <button class="btn-size btn-big" onclick="selectBet('BIG')">Big</button>
      <button class="btn-size btn-small" onclick="selectBet('SMALL')">Small</button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function selectBet(type) {
      alert("Selected Bet: " + type);
    }

    function selectNum(num) {
      alert("Selected Number: " + num);
    }

    socket.on('timer_tick', (data) => {
      document.getElementById('periodId').innerText = data.periodId;
      let sec = data.timer < 10 ? '0' + data.timer : data.timer;
      document.getElementById('timer').innerText = "00:" + sec;
    });
  </script>
</body>
</html>
